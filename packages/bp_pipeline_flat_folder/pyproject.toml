[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "bp-pipeline-flat-folder"
version = "0.1.0"
description = "Fast C++20 global flat-foldability checker and exact rational SAT certificate verifier for bp-pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "src/bp_pipeline_flat_folder/LICENSE"]
authors = [
    {name = "Google DeepMind"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "bp-pipeline>=0.1.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2606.26299"
Repository = "https://github.com/google-deepmind/origami-design"

[tool.scikit-build]
cmake.version = ">=3.25"
build.targets = ["_fast_flat_folder"]
wheel.packages = ["src/bp_pipeline_flat_folder"]
wheel.exclude = ["**/*.cc", "**/*.h", "**/BUILD"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
