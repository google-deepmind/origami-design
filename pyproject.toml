[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bp-pipeline"
version = "0.1.0"
description = "Automated Box-Pleating Origami Packing, Crease Pattern Solving, and 3D Shaping"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    {name = "Google DeepMind"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "absl-py>=2.0.0",
    "immutabledict>=3.0.0",
    "lxml>=4.9.0",
    "matplotlib>=3.7.0",
    "more-itertools>=10.0.0",
    "networkx>=3.1",
    "numpy>=1.24.0",
    "plotly>=5.0.0",
    "pydantic>=2.0.0",
    "scipy>=1.11.0",
]

[project.scripts]
bp-pipeline = "bp_pipeline.cli:main"

[project.urls]
Paper = "https://arxiv.org/abs/2606.26299"
Repository = "https://github.com/google-deepmind/origami-design"
Studio = "https://google-deepmind.github.io/origami-design/"

[project.optional-dependencies]
dev = [
    "Pillow>=10.0.0",
    "pytest>=7.4.0",
    "pytest-xdist>=3.3.0",
]

[dependency-groups]
dev = [
    "Pillow>=10.0.0",
    "pytest>=7.4.0",
    "pytest-xdist>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
